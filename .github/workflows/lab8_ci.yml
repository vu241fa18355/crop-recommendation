name: Lab 8 - Crop MLOps CI and Experiment Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python src/mlops_pipeline/crop_recommendation_pipeline.py
      - run: python check_project.py
      - run: python -m pytest tests -q
      - name: Upload experiment and lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crop-lab8-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            models/registry.json
          if-no-files-found: ignore
