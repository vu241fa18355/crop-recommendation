name: Crop Project Runner Checks

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python --version
        shell: pwsh
      - run: python -m pip install -r requirements.txt
        shell: pwsh
      - run: python src/crop_workflow.py validate
        shell: pwsh
      - run: python deployment/deploy_production.py --check
        shell: pwsh
