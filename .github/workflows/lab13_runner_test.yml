name: Crop Project Runner Checks

on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python --version
      - run: python -m pip install -r requirements.txt
      - run: python src/crop_workflow.py validate
      - run: python deployment/deploy_production.py --check
