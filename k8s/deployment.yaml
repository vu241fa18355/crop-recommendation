apiVersion: apps/v1
kind: Deployment
metadata:
  name: crop-recommendation-api
  labels:
    app: crop-recommendation-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crop-recommendation-api
  template:
    metadata:
      labels:
        app: crop-recommendation-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: crop-recommendation-api
          image: crop-recommendation-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: inference-logs
              mountPath: /app/logs
      volumes:
        - name: inference-logs
          emptyDir: {}
