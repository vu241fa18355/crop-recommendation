data:
  raw_path: data/raw/crop_recommendation.csv
  processed_dir: data/processed
  target_column: label
  feature_columns:
    - N
    - P
    - K
    - temperature
    - humidity
    - ph
    - rainfall

split:
  test_size: 0.2
  random_state: 42

model:
  n_estimators: 300
  max_depth:
  min_samples_leaf: 1
  random_state: 42
  n_jobs: -1

quality_gate:
  minimum_macro_f1: 0.90
